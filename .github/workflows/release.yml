name: Release Focusd

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  version:
    name: Validate release version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Read canonical version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p "require('./extension/package.json').version")"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]; then
            echo "extension/package.json has an invalid version: $version" >&2
            exit 1
          fi

          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            tag_version="${GITHUB_REF_NAME#v}"
            if [[ "$tag_version" != "$version" ]]; then
              echo "Tag v$tag_version does not match extension/package.json version $version" >&2
              exit 1
            fi
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"

  extension:
    name: Build and sign Firefox extension
    needs: version
    runs-on: ubuntu-latest
    env:
      FIREFOX_API_KEY: ${{ secrets.FIREFOX_API_KEY }}
      FIREFOX_API_SECRET: ${{ secrets.FIREFOX_API_SECRET }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        working-directory: extension
        run: bun install --frozen-lockfile

      - name: Compile extension
        working-directory: extension
        run: bun run compile

      - name: Build and wait for Mozilla signing
        working-directory: extension
        run: |
          set -euo pipefail
          test -n "$FIREFOX_API_KEY"
          test -n "$FIREFOX_API_SECRET"
          bun run build:firefox
          bunx --no-install web-ext sign \
            --source-dir .output/firefox-mv2 \
            --channel unlisted \
            --api-key "$FIREFOX_API_KEY" \
            --api-secret "$FIREFOX_API_SECRET" \
            --artifacts-dir .output

          xpi="$(find .output -maxdepth 1 -type f -name '*.xpi' -print -quit)"
          test -n "$xpi"
          mkdir -p ../dist
          cp "$xpi" "../dist/focusd.xpi"

      - name: Upload signed extension artifact
        uses: actions/upload-artifact@v4
        with:
          name: focusd-extension
          path: dist/focusd.xpi
          if-no-files-found: error

  daemon:
    name: Build daemon (${{ matrix.os }}-${{ matrix.arch }})
    needs: version
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows
            arch: amd64
            suffix: .exe
            gui: " -H windowsgui"
          - os: windows
            arch: arm64
            suffix: .exe
            gui: " -H windowsgui"
          - os: linux
            arch: amd64
            suffix: ""
            gui: ""
          - os: linux
            arch: arm64
            suffix: ""
            gui: ""
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: daemon/go.mod

      - name: Build daemon
        working-directory: daemon
        env:
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
          CGO_ENABLED: "0"
        run: |
          set -euo pipefail
          mkdir -p ../dist
          go build -trimpath \
            -ldflags="-s -w${{ matrix.gui }} -X main.version=${{ needs.version.outputs.version }}" \
            -o "../dist/focusd-${{ matrix.os }}-${{ matrix.arch }}${{ matrix.suffix }}" .

      - name: Upload daemon artifact
        uses: actions/upload-artifact@v4
        with:
          name: focusd-daemon-${{ matrix.os }}-${{ matrix.arch }}
          path: dist/focusd-*
          if-no-files-found: error

  release:
    name: Create GitHub release
    needs: [version, extension, daemon]
    runs-on: ubuntu-latest
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: focusd-*
          path: dist
          merge-multiple: true

      - name: Generate checksums and release manifest
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          cd dist
          sha256sum focusd-* > SHA256SUMS.txt
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          files = {}
          for path in sorted(Path(".").glob("focusd-*")):
              digest = hashlib.sha256(path.read_bytes()).hexdigest()
              files[path.name] = {
                  "name": path.name,
                  "sha256": digest,
              }

          manifest = {
              "version": os.environ["VERSION"],
              "artifacts": files,
          }
          Path("release-manifest.json").write_text(
              json.dumps(manifest, indent=2) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          gh release create "v${VERSION}" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "Focusd v${VERSION}" \
            --generate-notes
